name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            debug-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm --prefix debug-app run lint
      - run: npm run typecheck
      - run: npm --prefix debug-app run typecheck
      - run: npm run test:debug
      - run: npm --prefix debug-app test
      - run: npm run build
      - run: npm run test:debug-build
